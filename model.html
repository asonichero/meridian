<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Meridian · Models</title>
<style>html,body{margin:0;height:100%;background:#141414;overflow:hidden;font:13px system-ui,sans-serif;color:#ddd}#view{position:fixed;inset:0}
#bar{position:fixed;left:12px;top:12px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}#bar button{background:#262626;color:#eee;border:1px solid #444;border-radius:10px;padding:5px 10px;cursor:pointer}#bar button.on{border-color:#e8a84a;color:#ffd9a0}</style></head>
<body><div id="view"></div><div id="bar"></div>
<script src="vendor/three.min.js"></script><script src="vendor/OrbitControls.js"></script><script src="vendor/GLTFLoader.js"></script><script src="vendor/SkeletonUtils.js"></script>
<script>
// The Blender-built bodies (models/meridian_*.glb), front, side and back, as a turnaround sheet: ?sex=f|m, ?key=muscle:1,soft:0.5, ?wire=1, ?bones=1
const q = new URLSearchParams(location.search), sex = q.get('sex') || 'f';
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true }); renderer.setPixelRatio(Math.min(2, devicePixelRatio)); renderer.outputEncoding = THREE.sRGBEncoding;
document.getElementById('view').appendChild(renderer.domElement);
const scene = new THREE.Scene(); scene.background = new THREE.Color(0x141414);
const cam = new THREE.OrthographicCamera(-1, 1, 1, -1, 0.1, 20);
scene.add(new THREE.HemisphereLight(0xffffff, 0x404040, 0.75)); const key = new THREE.DirectionalLight(0xffffff, 0.75); key.position.set(1.5, 2.5, 3); scene.add(key);
const fill = new THREE.DirectionalLight(0xffffff, 0.35); fill.position.set(-2, 1, -2); scene.add(fill);
const mat = new THREE.MeshStandardMaterial({ color: 0xf6cfc0, roughness: 0.7, skinning: true, morphTargets: true, morphNormals: true, wireframe: !!q.get('wire') });
// framed as the turnaround the female base was measured from (models/meridian_meta.json): the same scale and places, so ?overlay=<image> lines up
let META = null, place = [[0, -1.15], [-Math.PI / 2, 0], [Math.PI, 1.15]], cy = 0.9, H = 1.0;
function resize() { const w = innerWidth, h = innerHeight; renderer.setSize(w, h); const a = w / h; cam.left = -H * a; cam.right = H * a; cam.top = H; cam.bottom = -H; cam.updateProjectionMatrix(); cam.position.set(cam.position.x || 0, cy, 5); cam.lookAt(cam.position.x || 0, cy, 0); }
addEventListener('resize', resize); resize();
if (q.get('overlay')) { const im = document.createElement('img'); im.src = q.get('overlay'); Object.assign(im.style, { position: 'fixed', inset: 0, width: '100%', height: '100%', opacity: q.get('alpha') || 0.5, pointerEvents: 'none', mixBlendMode: 'normal' }); document.body.append(im); }
fetch('models/meridian_meta.json').then(r => r.json()).catch(() => null).then(m => { META = m; if (m) {
  const [W, Hpx] = m.size, k = m.pxPerM; H = Hpx / 2 / k; cy = (m.sole - Hpx / 2) / k; resize();
  const toX = px => (px - W / 2) / k; place = [[0, toX(m.cx)], [-Math.PI / 2, toX(m.cz)], [Math.PI, toX((m.views[2] ? (m.views[2][0] + m.views[2][1]) / 2 : W - m.cx))]];
} if (q.get('zoom')) { const [zx, zy, zh] = q.get('zoom').split(',').map(Number); H = zh; cy = zy; cam.position.x = zx; resize(); cam.position.x = zx; cam.lookAt(zx, cy, 0); } load(); });
// ?wear=TunicBody,TunicSleeves,Trousers,Boots (or ?wear=uniform / offduty / under): which garments are shown over the body
const SETS = { uniform: 'Tunic,Trousers,Briefs,Boots', offduty: 'Shirt,Trousers,Briefs,Boots', under: 'Briefs,Boots', down: 'TunicUp,TrousersDown,BriefsDown,Boots', shirtup: 'ShirtUp,TrousersDown,Briefs,Boots' };
const wear = (SETS[q.get('wear')] || q.get('wear') || '').split(',');
const CLOTH = { Tunic: 0x3e5262, Shirt: 0x8a5a3c, Trousers: 0x2a2e34, Briefs: 0x4a4e56, Boots: 0x1e2024 };
const cmats = {};
function cloth(nm) { const k = Object.keys(CLOTH).find(k => nm.startsWith(k)); return cmats[k] || (cmats[k] = new THREE.MeshStandardMaterial({ color: CLOTH[k], roughness: 0.85, skinning: true, morphTargets: true, side: THREE.DoubleSide, wireframe: !!q.get('wire') })); }
function load() { new THREE.GLTFLoader().load('models/meridian_' + sex + '.glb', g => {
  const base = g.scene;
  place.forEach(([yaw, x], i) => {
    const s = i === 0 ? base : THREE.SkeletonUtils ? THREE.SkeletonUtils.clone(base) : base.clone(true);
    s.rotation.y = yaw; s.position.set(x, 0, 0);
    s.traverse(o => { if (o.isMesh) { const nm = o.name.replace(/_\d+$/, ''); o.visible = nm === 'Body' || wear.includes(nm); o.material = nm === 'Body' ? mat : cloth(nm); if (q.get('key')) for (const kv of q.get('key').split(',')) { const [k, v] = kv.split(':'); const i2 = o.morphTargetDictionary && o.morphTargetDictionary[k]; if (i2 != null) o.morphTargetInfluences[i2] = +v; } } });
    if (q.get('bones')) { const h = new THREE.SkeletonHelper(s); scene.add(h); }
    scene.add(s);
  });
  window.ready = true;
}, undefined, e => { document.body.append('load failed: ' + e); window.ready = true; }); }
(function loop() { renderer.render(scene, cam); requestAnimationFrame(loop); })();
</script></body></html>
